buildscript {
    repositories {
        mavenCentral()
        maven {
            url = "https://maven.google.com/"
        }
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            url = "https://maven.google.com/"
        }
        google()
        gradlePluginPortal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
